name: Build & publish JSON daily

on:
  schedule:
    # Expressed in UTC. 04:10 UTC ≈ 06:10 CEST / 05:10 CET
    # Runs Tuesday to Saturday only (2-6 in cron day-of-week)
    - cron: '10 4 * * 2-6'
  workflow_dispatch: {}

  # Regenerate the JSON immediately when manually modifying override or master.
  # Bot commits (GITHUB_TOKEN) do not trigger the workflow, so no loop occurs.
  push:
    branches: [main]
    paths:
      - 'data/overrides.yml'
      - 'data/bonds_master.json'

permissions:
  contents: write  # to commit in the repo

# Avoid two parallel executions that overwrite each other
concurrency:
  group: build-json
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python update_data_script.py

      - name: Commit & push (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/output_enriched.json data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update JSON ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          git pull --rebase
          git push
